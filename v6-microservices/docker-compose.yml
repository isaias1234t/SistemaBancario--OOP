services:
  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka


    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL}
      - AUTH_DATABASE_USER=${AUTH_DATABASE_USER}
      - AUTH_DATABASE_PASSWORD=${AUTH_DATABASE_PASSWORD}
      - EUREKA_URL=${EUREKA_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    depends_on:
      - eureka-server
    restart: unless-stopped

  conta-service:
    build:
      context: ./conta-service
    container_name: conta-service
    ports:
      - "8083:8083"
    environment:
      - CONTA_DATABASE_URL=${CONTA_DATABASE_URL}
      - CONTA_DATABASE_USER=${CONTA_DATABASE_USER}
      - CONTA_DATABASE_PASSWORD=${CONTA_DATABASE_PASSWORD}
      - EUREKA_URL=${EUREKA_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - eureka-server
      - kafka
    restart: unless-stopped

  cliente-service:
    build:
      context: ./cliente-service
    container_name: cliente-service
    ports:
      - "8081:8081"
    environment:
      - CLIENTE_DATABASE_URL=${CLIENTE_DATABASE_URL}
      - CLIENTE_DATABASE_USER=${CLIENTE_DATABASE_USER}
      - CLIENTE_DATABASE_PASSWORD=${CLIENTE_DATABASE_PASSWORD}
      - EUREKA_URL=${EUREKA_URL}
    depends_on:
      - eureka-server
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URL=${EUREKA_URL}
    depends_on:
      - eureka-server
      - auth-service
      - conta-service
      - cliente-service

    restart: unless-stopped