spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.mvc.routes[1].id=cliente-service
spring.cloud.gateway.mvc.routes[1].uri=lb://cliente-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/clientes/**

spring.cloud.gateway.mvc.routes[2].id=conta-service
spring.cloud.gateway.mvc.routes[2].uri=lb://conta-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/contas/**